# DEX Quickstart — One-command setup with embedded databases
#
# This compose file is for local trial of DEX. It includes
# embedded PostgreSQL and Neo4j services so you don't need
# to set up databases separately.
#
# Usage:
#   1. Create .env in this directory (see .env.quickstart.example)
#   2. Add your GROQ_API_KEY (free at console.groq.com/keys)
#   3. Run: docker compose -f docker-compose.quickstart.yml up
#   4. Open http://localhost:3000
#
# For production self-hosting (with your own databases, secrets
# management, etc.), use docker-compose.prod.yml instead.
#
# Default credentials below are intentionally weak — DO NOT
# expose this compose file to anything beyond your local machine.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dex_quickstart_pg
      POSTGRES_DB: dex
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/dex_quickstart_neo4j
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p dex_quickstart_neo4j 'RETURN 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    image: ghcr.io/rhythm2211/dex-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dex_quickstart_pg
      POSTGRES_DB: dex
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: dex_quickstart_neo4j
      NEO4J_DATABASE: neo4j
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      EMBEDDING_PROVIDER: local
    volumes:
      - backend_data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    image: ghcr.io/rhythm2211/dex-frontend:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8001
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch(`http://127.0.0.1:${process.env.PORT || 3000}`).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  postgres_data:
  neo4j_data:
  backend_data:
