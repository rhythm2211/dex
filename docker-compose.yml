services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dex-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dex_password}
      - POSTGRES_DB=${POSTGRES_DB:-dex}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Production resource limits (adjust based on your infrastructure)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  backend:
    build:
      context: ./app
      dockerfile: backend/Dockerfile
    container_name: dex-backend
    env_file:
      - ./app/.env  # Backend API paths and configuration
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    networks:
      - default
    environment:
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:3001","http://localhost:3000","http://frontend:3000"]}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}
      # Override PostgreSQL connection for Docker (use service name)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./app/backend/data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Production resource limits (adjust based on your infrastructure)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        - INTERNAL_API_URL=${INTERNAL_API_URL:-http://backend:8000}
        - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    container_name: dex-frontend
    env_file:
      - ./frontend/.env.local  # Frontend AUTH variables (GitHub/Google keys) and API paths
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - default
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://backend:8000}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      - backend
    restart: unless-stopped
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:

networks:
  default:
    name: dex-network